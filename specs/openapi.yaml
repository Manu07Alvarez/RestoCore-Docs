    AnalyticsEventRequest:
      type: object
      required:
        - event_type
        - tenant_slug
      properties:
        event_type:
          type: string
          enum: [menu_view, item_view, category_click]
          example: item_view
        tenant_slug:
          type: string
          example: el-gato-negro
        item_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        device_type:
          type: string
          enum: [mobile, desktop, tablet]
          example: mobile

    AnalyticsDashboardResponse:
      type: object
      required:
        - tenant_id
        - period_from
        - period_to
        - priority_high_metrics
      properties:
        tenant_id:
          type: string
          format: uuid
        period_from:
          type: string
          format: date
        period_to:
          type: string
          format: date
        priority_high_metrics:
          type: object
          description: Métricas de Tráfico e Ingeniería de Menú (Fase MVP)
          required:
            - total_qr_visits
            - monthly_qr_visits
            - top_viewed_items
            - top_categories
            - menu_engineering_matrix
          properties:
            total_qr_visits:
              type: integer
              example: 4520
            monthly_qr_visits:
              type: integer
              example: 1240
            top_viewed_items:
              type: array
              items:
                type: object
                properties:
                  item_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    example: Ojo de Bife
                  views_count:
                    type: integer
                    example: 890
            top_categories:
              type: array
              items:
                type: object
                properties:
                  category_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    example: Carnes
                  interactions_count:
                    type: integer
                    example: 2150
            menu_engineering_matrix:
              type: object
              description: Matriz de rentabilidad y popularidad (Ingeniería de Menú)
              properties:
                stars:
                  type: array
                  description: Alta popularidad y alto margen
                  items:
                    type: string
                    format: uuid
                plowhorses:
                  type: array
                  description: Alta popularidad y bajo margen
                  items:
                    type: string
                    format: uuid
                puzzles:
                  type: array
                  description: Baja popularidad y alto margen
                  items:
                    type: string
                    format: uuid
                dogs:
                  type: array
                  description: Baja popularidad y bajo margen
                  items:
                    type: string
                    format: uuid
        priority_medium_metrics:
          type: object
          nullable: true
          description: >
            Analítica de Rendimiento Temporal y Tráfico (Plan Pro). Excluye métricas de ocupación
            o permanencia física por QR (ADR-0012).
          properties:
            peak_hours:
              type: array
              items:
                type: object
                properties:
                  hour:
                    type: integer
                    example: 21
                  visits_count:
                    type: integer
                    example: 340
            device_breakdown:
              type: object
              properties:
                mobile_percentage:
                  type: number
                  example: 92.5
                desktop_percentage:
                  type: number
                  example: 7.5

