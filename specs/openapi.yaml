          type: string
          format: uuid
          description: Identificador del plato del catálogo asociado al elemento
        x:
          type: number
          description: Coordenada horizontal relativa o absoluta en píxeles
          example: 120.5
        y:
          type: number
          description: Coordenada vertical relativa o absoluta en píxeles
          example: 340.0
        z_index:
          type: integer
          description: Orden de profundidad de capas (z-index)
          example: 2
        width:
          type: number
          description: Ancho asignado al elemento sobre el lienzo
          example: 280.0
        height:
          type: number
          description: Altura asignada al elemento sobre el lienzo
          example: 160.0

