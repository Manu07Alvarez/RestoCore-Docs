        item_id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        status:
          type: string
          enum:
            - archived
          example: archived
        message:
          type: string
          example: El plato ha sido retirado de la carta. Los clientes ya no lo verán en el menú digital ni podrán pedirlo, pero todas tus ventas anteriores y reportes seguirán intactos y seguros.
        has_open_orders:
          type: boolean
          example: false
        archived_at:
          type: string
          format: date-time
          example: 2026-09-20T14:30:00Z
        retention_days:
          type: integer
          example: 7
          description: Ventana de retención en baja suave antes de la purga física permanente
        purge_scheduled_at:
          type: string
          format: date-time
          example: 2026-09-27T14:30:00Z
