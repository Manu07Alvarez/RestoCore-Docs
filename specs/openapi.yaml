openapi: 3.1.0
info:
  title: RestoCore REST API
  description: >
    Contrato oficial de API REST para la plataforma SaaS multi-tenant RestoCore.
    Define las interfaces para la carta digital pública, gestión de catálogo administrativo,
    capa aditiva de maquetación de lienzo (Canvas Mode), almacenamiento desacoplado con SeaweedFS
    y telemetría distribuida.
  version: 1.1.0
servers:
  - url: https://api.restocore.app
    description: Servidor de Producción Multi-Tenant
  - url: http://localhost:5000
    description: Servidor de Desarrollo Local

paths:
  /api/v1/tenants/{tenant_slug}/menu:
    get:
      tags:
        - Public Menu
      summary: Obtener carta digital pública completa
      description: >
        Retorna la carta gastronómica estructurada de un restaurante, optimizada para
        cumplir el presupuesto de latencia (< 2s LCP). Incluye soporte condicional de
        caché mediante ETag y el objeto opcional `layout_config` para maquetación en modo lienzo.
      operationId: getPublicMenu
      parameters:
        - name: tenant_slug
          in: path
          required: true
          description: Slug unívoco identificador del restaurante
          schema:
            type: string
            example: el-gato-negro
        - name: table_token
          in: query
          required: false
          description: Token criptográfico identificador de la mesa física
          schema:
            type: string
            example: sec_99a8b7
        - name: If-None-Match
          in: header
          required: false
          description: Hash de versión previo del cliente para validación condicional 304
          schema:
            type: string
      responses:
        '200':
          description: Carta gastronómica recuperada exitosamente
          headers:
            ETag:
              description: Hash criptográfico de la versión actual del catálogo
              schema:
                type: string
            Cache-Control:
              description: Directivas de almacenamiento en caché perimetral
              schema:
                type: string
                example: public, max-age=3600, s-maxage=86400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMenuResponse'
        '304':
          description: No Modificado (El cliente posee la versión más reciente en caché)
        '404':
          description: Restaurante o Tenant no encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/menu/layout:
    put:
      tags:
        - Admin - Menu & Canvas Layout
      summary: Guardar o restablecer configuración de maquetación de lienzo (Canvas Layout)
      description: >
        Permite al administrador o dueño del restaurante guardar, modificar o deshabilitar
        la disposición geométrica libre de platos sobre el lienzo visual (`layout_config`),
        desacoplado del catálogo de datos de negocio.
      operationId: updateMenuLayout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutConfig'
      responses:
        '200':
          description: Configuración de lienzo visual actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutConfig'
        '400':
          description: Esquema geométrico o coordenadas inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No autenticado (Falta token Bearer válido)
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
        '404':
          description: Tenant o menú no encontrado

  /api/v1/admin/menu/publish:
    post:
      tags:
        - Admin - Menu & Canvas Layout
      summary: Publicar menú y desencadenar compilación AOT e invalidación en CDN
      description: >
        Desencadena de forma asíncrona el pipeline de compilación Ahead-Of-Time (AOT)
        para el menú del restaurante. Aplana la geometría del lienzo (`layout_config`),
        procesa y optimiza las imágenes alojadas en SeaweedFS a formatos WebP y AVIF
        generando variantes adaptativas (`srcset`), deposita el artefacto estático y emite
        la orden de purgado de caché en la red perimetral (CDN). Retorna el estado del trabajo
        de compilación (SLA de finalización < 3 segundos).
      operationId: publishMenu
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuPublishRequest'
      responses:
        '202':
          description: Trabajo de compilación AOT y purgado perimetral iniciado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPublishJobResponse'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Inconsistencia o error de validación en el catálogo o lienzo previo a compilar
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Error interno durante la ejecución del pipeline AOT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/presigned-upload:
    post:
      tags:
        - Storage - SeaweedFS
      summary: Generar URL pre-firmada para subida directa de imágenes
      description: >
        Emite una URL temporal pre-firmada hacia SeaweedFS S3 Gateway para permitir
        la carga asíncrona desacoplada de fotografías de platos o fondos de lienzo (ADR-0004).
      operationId: generatePresignedUploadUrl
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - content_type
                - file_size_bytes
              properties:
                filename:
                  type: string
                  example: fondo-lienzo-madera.jpg
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                  example: image/jpeg
                file_size_bytes:
                  type: integer
                  maximum: 5242880
                  description: Tamaño del archivo en bytes (Máximo 5 MB)
                  example: 1048576
      responses:
        '200':
          description: URL pre-firmada generada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url:
                    type: string
                    format: uri
                    description: URL pre-firmada para transmisión PUT directa a SeaweedFS
                  public_url:
                    type: string
                    format: uri
                    description: URL pública final para almacenar en el recurso
                  expires_in_seconds:
                    type: integer
                    example: 900
        '400':
          description: Tipo de archivo o tamaño no permitido

  /api/v1/media/presigned-url:
    post:
      tags:
        - Storage - SeaweedFS
      summary: Alias para generación de URL pre-firmada hacia SeaweedFS
      description: Alias de compatibilidad para solicitud de URLs pre-firmadas hacia SeaweedFS.
      operationId: generateMediaPresignedUrl
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/PresignedUploadRequest'
      responses:
        '200':
          description: URL generada exitosamente

  /api/v1/admin/categories:
    post:
      tags:
        - Admin - Catalog
      summary: Crear nueva categoría de menú
      operationId: createCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Entradas
                sort_order:
                  type: integer
                  example: 1
                is_visible:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Categoría creada exitosamente

  /api/v1/admin/items:
    post:
      tags:
        - Admin - Catalog
      summary: Crear nuevo plato gastronómico
      operationId: createMenuItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category_id
                - name
                - price
              properties:
                category_id:
                  type: string
                  format: uuid
                name:
                  type: string
                  example: Hamburguesa Gourmet
                description:
                  type: string
                price:
                  type: number
                  format: double
                  example: 12500.00
                image_url:
                  type: string
                  format: uri
                dietary_tags:
                  type: array
                  items:
                    type: string
                  example: [celiac_safe, vegan]
      responses:
        '201':
          description: Plato creado exitosamente

  /api/v1/admin/items/{id}:
    delete:
      tags:
        - Admin - Catalog
      summary: Baja suave de plato gastronómico (Archivado de carta)
      description: >
        Ejecuta la baja suave (`IsDeleted = true`, `DeletedAtUtc = now`) del plato en el catálogo
        del restaurante (ADR-0010). Verifica que el plato no se encuentre en pedidos abiertos o
        en preparación en cocina (KDS). Si tiene pedidos activos en cocina, bloquea la acción
        retornando HTTP 409 Conflict con una advertencia humana comprensible. Si la baja suave
        se ejecuta con éxito, preserva la integridad contable e histórica en `OrderItem` mediante
        snapshots inmutables y desvinculación a clave foránea nulable, retornando una confirmación
        amigable y no técnica para el usuario.
      operationId: deleteMenuItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del plato gastronómico
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plato retirado exitosamente de la carta con confirmación amigable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemArchiveResponse'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Plato no encontrado en el tenant activo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Bloqueo de retiro por pedidos activos o en preparación en cocina
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/items/{id}/restore:
    post:
      tags:
        - Admin - Catalog
      summary: Restaurar plato gastronómico previamente retirado
      description: >
        Revierte la baja suave de un plato (`IsDeleted = false`, `DeletedAtUtc = null`) en el catálogo
        del restaurante (ADR-0010), reincorporándolo inmediatamente a la visualización de la carta
        digital para los clientes.
      operationId: restoreMenuItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del plato gastronómico a restaurar
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plato restaurado exitosamente en el catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemDto'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Plato no encontrado en el tenant activo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/kitchen/items/{id}/availability:
    patch:
      tags:
        - Kitchen Operations
      summary: Alternar disponibilidad de stock de un plato desde cocina (KDS)
      operationId: toggleItemAvailability
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_available
              properties:
                is_available:
                  type: boolean
      responses:
        '200':
          description: Disponibilidad actualizada

  /api/v1/admin/analytics/dashboard:
    get:
      tags:
        - Admin - Analytics
      summary: Obtener panel analítico e ingeniería de menú
      description: >
        Retorna las métricas analíticas del restaurante según la jerarquía establecida (ADR-0011):
        Métricas de Nivel 1 (Tráfico de acceso QR día/mes, visualizaciones de platos, matriz de ingeniería
        de menú y categorías más populares) y, condicionalmente para Plan Pro, métricas de Nivel 2
        (distribución horaria de horas pico, RevPASH estimado y rotación de mesas).
      operationId: getAnalyticsDashboard
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Fecha de inicio del intervalo de análisis (ISO-8601)
          schema:
            type: string
            format: date
            example: '2026-09-01'
        - name: to
          in: query
          required: false
          description: Fecha de fin del intervalo de análisis (ISO-8601)
          schema:
            type: string
            format: date
            example: '2026-09-30'
      responses:
        '200':
          description: Datos analíticos recuperados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsDashboardResponse'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/analytics/collect:
    post:
      tags:
        - Analytics - Ingestion
      summary: Registrar evento analítico de navegación de cliente
      description: >
        Ingesta asíncrona desacoplada de eventos de interacción (escaneo de QR o visualización de plato)
        desde la carta digital del comensal. Cumple con el presupuesto de rendimiento (< 2s LCP) y
        políticas de privacidad sin recopilar PII.
      operationId: collectAnalyticsEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventRequest'
      responses:
        '202':
          description: Evento aceptado para procesamiento asíncrono
        '400':
          description: Evento o parámetros inválidos

  /healthz:
    get:
      tags:
        - Health
      summary: Verificación de vitalidad del proceso (Liveness)
      responses:
        '200':
          description: Proceso activo

  /ready:
    get:
      tags:
        - Health
      summary: Verificación de preparación y dependencias externas (Readiness)
      description: Audita la conectividad con PostgreSQL, Redis, SeaweedFS y OPA.
      responses:
        '200':
          description: Todas las dependencias operativas
        '503':
          description: Una o más dependencias externas no disponibles

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT que contiene las reclamaciones `tenant_id`, `sub` y `roles`.

  requestBodies:
    PresignedUploadRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - filename
              - content_type
              - file_size_bytes
            properties:
              filename:
                type: string
              content_type:
                type: string
              file_size_bytes:
                type: integer

  schemas:
    PublicMenuResponse:
      type: object
      required:
        - tenant_id
        - tenant_slug
        - name
        - categories
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_slug:
          type: string
          example: don-pepe
        name:
          type: string
          example: Parrilla Don Pepe
        branding:
          $ref: '#/components/schemas/BrandingConfig'
        layout_config:
          $ref: '#/components/schemas/LayoutConfig'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'

    BrandingConfig:
      type: object
      properties:
        logo_url:
          type: string
          format: uri
        banner_url:
          type: string
          format: uri
        primary_color:
          type: string
          example: '#FF5722'
        accent_color:
          type: string
          example: '#4CAF50'
        currency_symbol:
          type: string
          example: '$'

    LayoutConfig:
      type: object
      description: Configuración aditiva de la maquetación visual en modo lienzo (Canvas Mode)
      required:
        - canvas_enabled
      properties:
        canvas_enabled:
          type: boolean
          description: Bandera que activa o desactiva la maquetación libre sobre lienzo
          example: true
        background_url:
          type: string
          format: uri
          nullable: true
          description: URL pública de la imagen de fondo alojada en SeaweedFS
          example: https://storage.restocore.app/canvas-bg.webp
        background_color:
          type: string
          nullable: true
          description: Color de fondo CSS del lienzo (código hexadecimal o RGB)
          example: '#1A1A1A'
        elements:
          type: array
          description: Listado de elementos y platos posicionados sobre el lienzo
          items:
            $ref: '#/components/schemas/CanvasElement'

    CanvasElement:
      type: object
      required:
        - dish_id
        - x
        - y
        - z_index
        - width
        - height
      properties:
        dish_id:
          type: string
          format: uuid
          description: Identificador del plato del catálogo asociado al elemento
        x:
          type: number
          description: Coordenada horizontal relativa o absoluta en píxeles
          example: 120.5
        y:
          type: number
          description: Coordenada vertical relativa o absoluta en píxeles
          example: 340.0
        z_index:
          type: integer
          description: Orden de profundidad de capas (z-index)
          example: 2
        width:
          type: number
          description: Ancho asignado al elemento sobre el lienzo
          example: 280.0
        height:
          type: number
          description: Altura asignada al elemento sobre el lienzo
          example: 160.0

    CategoryDto:
      type: object
      required:
        - id
        - name
        - sort_order
        - items
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sort_order:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemDto'

    MenuItemDto:
      type: object
      required:
        - id
        - name
        - price
        - is_available
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        image_url:
          type: string
          format: uri
        is_available:
          type: boolean
        dietary_tags:
          type: array
          items:
            type: string

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        trace_id:
          type: string

    MenuPublishRequest:
      type: object
      properties:
        force_recompile:
          type: boolean
          default: false
          description: Forzar recompilación completa de activos multimedia aunque no hayan mutado

    MenuPublishJobResponse:
      type: object
      required:
        - job_id
        - tenant_slug
        - status
        - triggered_at
      properties:
        job_id:
          type: string
          format: uuid
          example: 8c12a34b-5678-4901-abcd-ef1234567890
        tenant_slug:
          type: string
          example: el-gato-negro
        status:
          type: string
          enum:
            - queued
            - processing
            - completed
            - failed
          example: processing
        estimated_duration_seconds:
          type: integer
          example: 3
          description: Presupuesto máximo SLA para la culminación del pipeline AOT
        version_hash:
          type: string
          example: v20260917-a1b2c3d4
        cdn_purge_requested:
          type: boolean
          example: true
        assets_queued:
          type: integer
          example: 12
        triggered_at:
          type: string
          format: date-time

    MenuItemArchiveResponse:
      type: object
      required:
        - item_id
        - status
        - message
        - has_open_orders
      properties:
        item_id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        status:
          type: string
          enum:
            - archived
          example: archived
        message:
          type: string
          example: El plato ha sido retirado de la carta. Los clientes ya no lo verán en el menú digital ni podrán pedirlo, pero todas tus ventas anteriores y reportes seguirán intactos y seguros.
        has_open_orders:
          type: boolean
          example: false
        archived_at:
          type: string
          format: date-time
          example: 2026-09-20T14:30:00Z

    AnalyticsEventRequest:
      type: object
      required:
        - event_type
        - tenant_slug
      properties:
        event_type:
          type: string
          enum: [menu_view, item_view, category_click]
          example: item_view
        tenant_slug:
          type: string
          example: el-gato-negro
        item_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        device_type:
          type: string
          enum: [mobile, desktop, tablet]
          example: mobile

    AnalyticsDashboardResponse:
      type: object
      required:
        - tenant_id
        - period_from
        - period_to
        - priority_high_metrics
      properties:
        tenant_id:
          type: string
          format: uuid
        period_from:
          type: string
          format: date
        period_to:
          type: string
          format: date
        priority_high_metrics:
          type: object
          description: Métricas de Tráfico e Ingeniería de Menú (Fase MVP)
          required:
            - total_qr_visits
            - monthly_qr_visits
            - top_viewed_items
            - top_categories
            - menu_engineering_matrix
          properties:
            total_qr_visits:
              type: integer
              example: 4520
            monthly_qr_visits:
              type: integer
              example: 1240
            top_viewed_items:
              type: array
              items:
                type: object
                properties:
                  item_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    example: Ojo de Bife
                  views_count:
                    type: integer
                    example: 890
            top_categories:
              type: array
              items:
                type: object
                properties:
                  category_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    example: Carnes
                  interactions_count:
                    type: integer
                    example: 2150
            menu_engineering_matrix:
              type: object
              description: Matriz de rentabilidad y popularidad (Ingeniería de Menú)
              properties:
                stars:
                  type: array
                  description: Alta popularidad y alto margen
                  items:
                    type: string
                    format: uuid
                plowhorses:
                  type: array
                  description: Alta popularidad y bajo margen
                  items:
                    type: string
                    format: uuid
                puzzles:
                  type: array
                  description: Baja popularidad y alto margen
                  items:
                    type: string
                    format: uuid
                dogs:
                  type: array
                  description: Baja popularidad y bajo margen
                  items:
                    type: string
                    format: uuid
        priority_medium_metrics:
          type: object
          nullable: true
