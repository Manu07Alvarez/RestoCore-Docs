openapi: 3.1.0
info:
  title: RestoCore REST API
  description: >
    Contrato oficial de API REST para la plataforma SaaS multi-tenant RestoCore.
    Define las interfaces para la carta digital pública, gestión de catálogo administrativo,
    capa aditiva de maquetación de lienzo (Canvas Mode), almacenamiento desacoplado con SeaweedFS
    y telemetría distribuida.
  version: 1.1.0
servers:
  - url: https://api.restocore.app
    description: Servidor de Producción Multi-Tenant
  - url: http://localhost:5000
    description: Servidor de Desarrollo Local

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Authentication & Identity
      summary: Iniciar sesión y obtener token JWT
      description: >
        Autentica un usuario (administrador de tenant, cocinero o superadministrador)
        mediante correo electrónico y contraseña, emitiendo un token JWT firmado con claims
        de identidad, roles y tenant asociado.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa y token JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    example: Unauthorized
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Credenciales inválidas

  /api/v1/auth/me:
    get:
      tags:
        - Authentication & Identity
      summary: Consultar perfil del usuario autenticado
      description: >
        Retorna la identidad, claims y roles del usuario autenticado según el token JWT provisto.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil de usuario recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Token no provisto o inválido

  /api/v1/tenants/{tenant_slug}/menu:
    get:
      tags:
        - Public Menu
      summary: Obtener carta digital pública completa
      description: >
        Retorna la carta gastronómica estructurada de un restaurante, optimizada para
        cumplir el presupuesto de latencia (< 2s LCP). Omite de manera transparente cualquier
        plato o categoría que se encuentre en estado de baja suave (`is_deleted == true` o
        `deleted_at != null`). Incluye soporte condicional de caché mediante ETag y el objeto
        opcional `layout_config` para maquetación en modo lienzo.
      operationId: getPublicMenu
      parameters:
        - name: tenant_slug
          in: path
          required: true
          description: Slug unívoco identificador del restaurante
          schema:
            type: string
            example: el-gato-negro
        - name: table_token
          in: query
          required: false
          description: >
            Token criptográfico identificador de la mesa física. Actúa exclusivamente como parámetro
            contextual opcional para asociar la comanda a la mesa si se requiere, descartando el
            seguimiento de ocupación o permanencia física por escaneo (ADR-0012).
          schema:
            type: string
            example: sec_99a8b7
        - name: If-None-Match
          in: header
          required: false
          description: Hash de versión previo del cliente para validación condicional 304
          schema:
            type: string
      responses:
        '200':
          description: Carta gastronómica recuperada exitosamente
          headers:
            ETag:
              description: Hash criptográfico de la versión actual del catálogo
              schema:
                type: string
            Cache-Control:
              description: Directivas de almacenamiento en caché perimetral
              schema:
                type: string
                example: public, max-age=3600, s-maxage=86400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMenuResponse'
        '304':
          description: No Modificado (El cliente posee la versión más reciente en caché)
        '404':
          description: Restaurante o Tenant no encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/menu/layout:
    put:
      tags:
        - Admin - Menu & Canvas Layout
      summary: Guardar o restablecer configuración de maquetación de lienzo (Canvas Layout)
      description: >
        Permite al administrador o dueño del restaurante guardar, modificar o deshabilitar
        la disposición geométrica libre de platos sobre el lienzo visual (`layout_config`),
        desacoplado del catálogo de datos de negocio.
      operationId: updateMenuLayout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutConfig'
      responses:
        '200':
          description: Configuración de lienzo visual actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutConfig'
        '400':
          description: Esquema geométrico o coordenadas inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No autenticado (Falta token Bearer válido)
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
        '404':
          description: Tenant o menú no encontrado

  /api/v1/admin/menu/publish:
    post:
      tags:
        - Admin - Menu & Canvas Layout
      summary: Publicar menú y desencadenar compilación AOT e invalidación en CDN
      description: >
        Desencadena de forma asíncrona el pipeline de compilación Ahead-Of-Time (AOT)
        para el menú del restaurante. Aplana la geometría del lienzo (`layout_config`),
        procesa y optimiza las imágenes alojadas en SeaweedFS a formatos WebP y AVIF
        generando variantes adaptativas (`srcset`), deposita el artefacto estático y emite
        la orden de purgado de caché en la red perimetral (CDN). Retorna el estado del trabajo
        de compilación (SLA de finalización < 3 segundos).
      operationId: publishMenu
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuPublishRequest'
      responses:
        '202':
          description: Trabajo de compilación AOT y purgado perimetral iniciado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPublishJobResponse'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Inconsistencia o error de validación en el catálogo o lienzo previo a compilar
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Error interno durante la ejecución del pipeline AOT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/presigned-upload:
    post:
      tags:
        - Storage - SeaweedFS
      summary: Generar URL pre-firmada para subida directa de imágenes
      description: >
        Emite una URL temporal pre-firmada hacia SeaweedFS S3 Gateway para permitir
        la carga asíncrona desacoplada de fotografías de platos o fondos de lienzo (ADR-0004).
      operationId: generatePresignedUploadUrl
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - content_type
                - file_size_bytes
              properties:
                filename:
                  type: string
                  example: fondo-lienzo-madera.jpg
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                  example: image/jpeg
                file_size_bytes:
                  type: integer
                  maximum: 5242880
                  description: Tamaño del archivo en bytes (Máximo 5 MB)
                  example: 1048576
      responses:
        '200':
          description: URL pre-firmada generada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url:
                    type: string
                    format: uri
                    description: URL pre-firmada para transmisión PUT directa a SeaweedFS
                  public_url:
                    type: string
                    format: uri
                    description: URL pública final para almacenar en el recurso
                  expires_in_seconds:
                    type: integer
                    example: 900
        '400':
          description: Tipo de archivo o tamaño no permitido

  /api/v1/media/presigned-url:
    post:
      tags:
        - Storage - SeaweedFS
      summary: Alias para generación de URL pre-firmada hacia SeaweedFS
      description: Alias de compatibilidad para solicitud de URLs pre-firmadas hacia SeaweedFS.
      operationId: generateMediaPresignedUrl
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/PresignedUploadRequest'
      responses:
        '200':
          description: URL generada exitosamente

  /api/v1/admin/categories:
    post:
      tags:
        - Admin - Catalog
      summary: Crear nueva categoría de menú
      operationId: createCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Entradas
                sort_order:
                  type: integer
                  example: 1
                is_visible:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Categoría creada exitosamente

  /api/v1/admin/items:
    post:
      tags:
        - Admin - Catalog
      summary: Crear nuevo plato gastronómico
      description: >
        Registra un nuevo plato gastronómico asociado a una categoría única (`1:N`).
        Valida que el `category_id` provisto exista y pertenezca al tenant activo.
        Conserva atributos nutricionales y etiquetas dietéticas estructuradas (`dietary_labels`).
      operationId: createMenuItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuItemRequest'
      responses:
        '201':
          description: Plato creado exitosamente en el catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemDto'
        '400':
          description: Datos de solicitud con formato inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: "Error de validación de negocio (categoría inexistente o no válida para el tenant)"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/items/{id}:
    put:
      tags:
        - Admin - Catalog
      summary: Modificación total de plato gastronómico
      description: >
        Actualiza la totalidad de los atributos de un plato existente. Requiere la asignación
        unívoca a una categoría válida (`category_id`) y actualiza precio, disponibilidad,
        modificadores y etiquetas dietéticas (`dietary_labels`). Invalida el caché en CDN.
      operationId: updateMenuItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del plato gastronómico
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuItemRequest'
      responses:
        '200':
          description: Plato actualizado completamente con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemDto'
        '400':
          description: Solicitud con estructura de datos inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Plato no encontrado en el tenant activo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: "Error de validación semántica (categoría destino inexistente o no válida)"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    patch:
      tags:
        - Admin - Catalog
      summary: Modificación parcial de plato gastronómico
      description: >
        Actualiza un subconjunto específico de propiedades de un plato existente (ejemplo: cambiar
        únicamente precio, disponibilidad o agregar una etiqueta dietética). Si se provee `category_id`,
        valida que la categoría exista y pertenezca al tenant activo.
      operationId: patchMenuItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del plato gastronómico
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMenuItemRequest'
      responses:
        '200':
          description: Propiedades del plato actualizadas con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemDto'
        '400':
          description: Solicitud con estructura de datos inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Plato no encontrado en el tenant activo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: "Error de validación semántica (categoría destino inexistente o inválida)"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      tags:
        - Admin - Catalog
      summary: Baja suave de plato gastronómico con retención de 7 días (Archivado de carta)
      description: >
        Ejecuta la baja suave (`is_deleted = true`, `deleted_at = UtcNow`) del plato en el catálogo
        del restaurante (ADR-0010). Verifica que el plato no se encuentre en pedidos abiertos o
        en preparación en cocina (KDS). Si tiene pedidos activos en cocina, bloquea la acción
        retornando HTTP 409 Conflict con una advertencia humana comprensible.
        Si la baja suave se ejecuta con éxito, preserva la integridad contable e histórica en `OrderItem`
        mediante snapshots inmutables, oculta el plato inmediatamente de la carta pública y programa
        su purga física definitiva para 7 días posteriores. Durante este plazo de 7 días, el plato puede
        ser restaurado desde el panel de administración.
      operationId: deleteMenuItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del plato gastronómico
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plato retirado exitosamente de la carta con confirmación amigable y retención de 7 días
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemArchiveResponse'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Plato no encontrado en el tenant activo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Bloqueo de retiro por pedidos activos o en preparación en cocina
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/items/{id}/restore:
    post:
      tags:
        - Admin - Catalog
      summary: Restaurar plato gastronómico archivado dentro de la ventana de 7 días
      description: >
        Revierte la baja suave de un plato (`is_deleted = false`, `deleted_at = null`) en el catálogo
        del restaurante (ADR-0010), siempre que se encuentre dentro del periodo de retención de 7 días
        previo a la purga definitiva. Reincorpora inmediatamente el plato a la visualización de la carta
        digital para los clientes e invalida la caché perimetral.
      operationId: restoreMenuItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del plato gastronómico a restaurar
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plato restaurado exitosamente en el catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemDto'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Plato no encontrado o plazo de retención de 7 días vencido (purgado definitivamente)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/kitchen/items/{id}/availability:
    patch:
      tags:
        - Kitchen Operations
      summary: Alternar disponibilidad de stock de un plato desde cocina (KDS)
      operationId: toggleItemAvailability
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_available
              properties:
                is_available:
                  type: boolean
      responses:
        '200':
          description: Disponibilidad actualizada

  /api/v1/admin/analytics/dashboard:
    get:
      tags:
        - Admin - Analytics
      summary: Obtener panel analítico e ingeniería de menú
      description: >
        Retorna las métricas analíticas del restaurante según la jerarquía establecida (ADR-0011):
        Métricas de Nivel 1 (Tráfico de acceso QR día/mes, visualizaciones de platos, matriz de ingeniería
        de menú y categorías más populares) y, condicionalmente para Plan Pro, métricas de Nivel 2
        (distribución horaria de horas pico, RevPASH estimado y rotación de mesas).
      operationId: getAnalyticsDashboard
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Fecha de inicio del intervalo de análisis (ISO-8601)
          schema:
            type: string
            format: date
            example: '2026-09-01'
        - name: to
          in: query
          required: false
          description: Fecha de fin del intervalo de análisis (ISO-8601)
          schema:
            type: string
            format: date
            example: '2026-09-30'
      responses:
        '200':
          description: Datos analíticos recuperados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsDashboardResponse'
        '401':
          description: No autenticado (Falta token Bearer válido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/analytics/collect:
    post:
      tags:
        - Analytics - Ingestion
      summary: Registrar evento analítico de navegación de cliente
      description: >
        Ingesta asíncrona desacoplada de eventos de interacción (escaneo de QR o visualización de plato)
        desde la carta digital del comensal. Cumple con el presupuesto de rendimiento (< 2s LCP) y
        políticas de privacidad sin recopilar PII.
      operationId: collectAnalyticsEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventRequest'
      responses:
        '202':
          description: Evento aceptado para procesamiento asíncrono
        '400':
          description: Evento o parámetros inválidos

  /healthz:
    get:
      tags:
        - Health
      summary: Verificación de vitalidad del proceso (Liveness)
      responses:
        '200':
          description: Proceso activo

  /ready:
    get:
      tags:
        - Health
      summary: Verificación de preparación y dependencias externas (Readiness)
      description: Audita la conectividad con PostgreSQL, Redis, SeaweedFS y OPA.
      responses:
        '200':
          description: Todas las dependencias operativas
        '503':
          description: Una o más dependencias externas no disponibles

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT que contiene las reclamaciones `tenant_id`, `sub` y `roles`.

  requestBodies:
    PresignedUploadRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - filename
              - content_type
              - file_size_bytes
            properties:
              filename:
                type: string
              content_type:
                type: string
              file_size_bytes:
                type: integer

  schemas:
    PublicMenuResponse:
      type: object
      required:
        - tenant_id
        - tenant_slug
        - name
        - categories
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_slug:
          type: string
          example: don-pepe
        name:
          type: string
          example: Parrilla Don Pepe
        branding:
          $ref: '#/components/schemas/BrandingConfig'
        layout_config:
          $ref: '#/components/schemas/LayoutConfig'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'

    BrandingConfig:
      type: object
      properties:
        logo_url:
          type: string
          format: uri
        banner_url:
          type: string
          format: uri
        primary_color:
          type: string
          example: '#FF5722'
        accent_color:
          type: string
          example: '#4CAF50'
        currency_symbol:
          type: string
          example: '$'

    LayoutConfig:
      type: object
      description: Configuración aditiva de la maquetación visual en modo lienzo (Canvas Mode)
      required:
        - canvas_enabled
      properties:
        canvas_enabled:
          type: boolean
          description: Bandera que activa o desactiva la maquetación libre sobre lienzo
          example: true
        background_url:
          type: string
          format: uri
          nullable: true
          description: URL pública de la imagen de fondo alojada en SeaweedFS
          example: https://storage.restocore.app/canvas-bg.webp
        background_color:
          type: string
          nullable: true
          description: Color de fondo CSS del lienzo (código hexadecimal o RGB)
          example: '#1A1A1A'
        elements:
          type: array
          description: Listado de elementos y platos posicionados sobre el lienzo
          items:
            $ref: '#/components/schemas/CanvasElement'

    CanvasElement:
      type: object
